services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: trading_analyzer
      MYSQL_USER: trading
      MYSQL_PASSWORD: trading
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"     # конфликт порта? поменяйте на "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    # Если контейнер падает на старых метаданных (см. logs) — замените image на:
    #   yandex/clickhouse-server:21.3
    environment:
      CLICKHOUSE_DO_NOT_CHOWN: "1"   # chown на macOS bind-mount не работает;
                                      # вместо него: chmod -R a+rwX clickhouse-data
    volumes:
      - ./clickhouse-data:/var/lib/clickhouse
    # Порты на хост не пробрасываем: 9000/9001 у вас заняты, а Grafana и
    # clickhouse-client (через docker compose exec) работают внутри сети.
    # Нужен доступ с хоста (DBeaver/Python)? добавьте "8124:8123".
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "-q", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    ports:
      - "3000:3000"     # конфликт порта? поменяйте на "3001:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  mysql_data:
  grafana_data:
